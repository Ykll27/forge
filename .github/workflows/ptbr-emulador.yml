# Abre o APK publicado na release daily-snapshots num emulador Android parecido com um celular
# simples (720x1600 deitado, 2 GB de RAM: cai no aviso de especificação do Forge), segue o roteiro
# de toques de .github/emulador/roteiro.sh e guarda as capturas de tela e o logcat no run.
name: PT-BR - emulador

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ptbr-emulador]

permissions:
  contents: read

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Baixar o APK da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p emu && cd emu
          gh release download daily-snapshots --repo "$GITHUB_REPOSITORY" -p Forge-PT-BR.apk -p version.txt
          echo "versão: $(cat version.txt)"

      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .github/emulador/rodar.sh

      # Também no log (JPEG em base64), para quem não consegue baixar artefatos do run.
      - name: Capturas no log
        if: always()
        run: |
          cd emu/capturas || exit 0
          for f in estado.txt pasta-forge.txt erros.txt; do
            [ -f "$f" ] && { echo "=== ARQUIVO $f ==="; cat "$f"; echo "=== FIM ==="; }
          done
          python3 -m pip install --quiet --disable-pip-version-check pillow > /dev/null 2>&1 || true
          for p in *.png; do
            [ -f "$p" ] || continue
            img="$p"
            if python3 -c "import sys; from PIL import Image; Image.open(sys.argv[1]).convert('RGB').save(sys.argv[2], quality=70)" "$p" "${p%.png}.jpg"; then
              img="${p%.png}.jpg"
            fi
            echo "=== CAPTURA ${p%.png} ==="
            base64 -w 4000 "$img"   # o log corta linhas muito longas
            echo "=== FIM ==="
          done

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-emulador
          path: emu/capturas/
          if-no-files-found: warn
