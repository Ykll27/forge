name: PT-BR - testes e APK

# Valida a versão em português e gera um APK de teste instalável.
# 1. testes dos módulos tocados (tradutor, Scryfall simulado, camadas de tradução, partidas IA x IA)
# 2. confere se res/languages/cardnames-pt-BR-automatica.txt está atualizado
# 3. compila o APK (perfil android-test-build) e publica como artefato

on:
  workflow_dispatch:
  push:
    paths:
      - 'forge-ptbr/**'
      - 'forge-core/src/main/java/forge/util/CardTranslation.java'
      - 'forge-gui/src/main/java/forge/gui/ptbr/**'
      - 'forge-gui-mobile/src/forge/card/**'
      - 'forge-gui-mobile/src/forge/deck/**'
      - 'forge-gui-android/**'
      - 'forge-core/src/main/java/forge/deck/**'
      - 'forge-core/src/main/java/forge/StaticData.java'
      - 'forge-gui/res/languages/cardnames-pt-BR*'
      - '.github/workflows/ptbr-build.yml'

jobs:
  testes:
    runs-on: ubuntu-latest
    name: Testes PT-BR
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Testes (core, ai, ptbr)
        run: mvn -B -pl forge-core,forge-game,forge-ai,forge-ptbr -am test

      - name: Traduções automáticas em dia
        run: |
          mvn -B -q -pl forge-ptbr -am -DskipTests install
          CP="forge-ptbr/target/classes:$(ls ~/.m2/repository/com/google/code/gson/gson/2.13.2/gson-2.13.2.jar)"
          java -cp "$CP" forge.ptbr.tools.GenerateAutomaticTranslations forge-gui/res --force
          if ! git diff --quiet -- forge-gui/res/languages/cardnames-pt-BR-automatica.txt; then
            echo "::error::cardnames-pt-BR-automatica.txt desatualizado. Rode a ferramenta GenerateAutomaticTranslations e faça commit."
            git diff --stat -- forge-gui/res/languages/cardnames-pt-BR-automatica.txt
            git diff -U0 -- forge-gui/res/languages/cardnames-pt-BR-automatica.txt | head -60
            exit 1
          fi

  apk:
    runs-on: ubuntu-latest
    needs: testes
    name: APK de teste
    permissions:
      contents: write   # publicar a release "daily-snapshots" do fork
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Ferramentas Android
        run: |
          JAVA_HOME=${JAVA_HOME_17_X64} ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "build-tools;35.0.0" "platform-tools" "platforms;android-35"

      - name: Plugin Android para Maven
        run: |
          mkdir -p ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          cd ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          curl -L -o android-maven-plugin-4.6.2.jar https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl -L -o android-maven-plugin-4.6.2.pom https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom

      - name: Compilar
        run: |
          command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -B install -Dmaven.test.skip=true
          mvn -U -B -P android-test-build verify -e -T 1C -Dandroid.sdk.path=$ANDROID_SDK_ROOT -Dandroid.buildToolsVersion=35.0.0 -Dmaven.test.skip=true

      # O app baixa os recursos (res/) à parte, como assets.zip. O perfil de teste não gera esse
      # arquivo; ele é montado aqui com o mesmo conteúdo do perfil android-release-build.
      # O atualizador do app procura forge-android-<versão>-signed-aligned.apk na release.
      - name: Montar assets.zip e arquivos da release
        run: |
          set -euo pipefail
          A=forge-gui-android/target
          rm -rf "$A/res" "$A/assets.zip" release
          mkdir -p "$A/res/res/cardsfolder" release
          cp forge-gui/LICENSE.txt forge-gui/release-files/CONTRIBUTORS.txt \
             forge-gui/release-files/INSTALLATION.txt forge-gui/release-files/ISSUES.txt "$A/res/"
          cp forge-gui-mobile-dev/sentry.properties "$A/res/" 2>/dev/null || true
          tar -C forge-gui/res --exclude=./cardsfolder -cf - . | tar -C "$A/res/res" -xf -
          cp "$A/classes/assets/build.txt" "$A/res/res/"
          (cd forge-gui/res/cardsfolder && zip -q -1 -r "$GITHUB_WORKSPACE/$A/res/res/cardsfolder/cardsfolder.zip" .)
          (cd "$A/res" && zip -q -1 -r ../assets.zip . -x '*.xcf')
          rm -rf "$A/res"
          VERSION=$(tr -d '[:space:]' < "$A/classes/assets/version.txt")
          APK=$(ls "$A"/*-aligned-debugSigned.apk | head -1)
          cp "$APK" "release/forge-android-$VERSION-signed-aligned.apk"
          cp "$APK" release/Forge-PT-BR.apk
          cp "$A/assets.zip" "$A/classes/assets/version.txt" "$A/classes/assets/build.txt" release/
          unzip -l release/assets.zip > assets-list.txt
          grep -q "res/languages/cardnames-pt-BR-automatica.txt" assets-list.txt
          grep -q "res/cardsfolder/cardsfolder.zip" assets-list.txt
          rm assets-list.txt
          ls -la release

      - name: Guardar APK e recursos no run
        uses: actions/upload-artifact@v4
        with:
          name: forge-ptbr-apk
          path: release/
          if-no-files-found: error

      # O app (versão SNAPSHOT) busca version.txt, build.txt e assets.zip em
      # GITHUB_FORGE_URL/releases/download/daily-snapshots/ (ForgeConstants). Com GITHUB_FORGE_URL
      # apontando para este fork, esta release é o que o celular baixa na primeira abertura.
      - name: Publicar release daily-snapshots
        if: github.event_name == 'workflow_dispatch' || github.ref_name == 'ptbr-mobile'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete daily-snapshots --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create daily-snapshots release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Forge PT-BR (teste)" \
            --notes "Baixe e instale o Forge-PT-BR.apk (assinado com chave de depuração). Na primeira abertura o app baixa o assets.zip desta release (cerca de 190 MB; prefira Wi-Fi)."
